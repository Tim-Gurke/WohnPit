name: WohnPit-Release veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - releases/current.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: wohnpit-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Geprüfte signierte APK und Quellstand kontrollieren
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prepare-release.py
      - name: Release mit APK und Prüfsumme veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ steps.prepare.outputs.title }}
          RELEASE_APK: ${{ steps.prepare.outputs.apk }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          tag, repo = os.environ["RELEASE_TAG"], os.environ["GITHUB_REPOSITORY"]
          assets = json.load(open("release-out/assets.json"))
          existing = subprocess.run(["gh", "release", "view", tag, "--repo", repo], capture_output=True)
          if existing.returncode == 0:
              subprocess.run(["gh", "release", "upload", tag, *assets, "--repo", repo, "--clobber"], check=True)
              command = ["gh", "release", "edit", tag, "--repo", repo]
          else:
              command = ["gh", "release", "create", tag, *assets, "--repo", repo, "--target", os.environ["GITHUB_SHA"]]
          subprocess.run([*command, "--title", os.environ["RELEASE_TITLE"], "--notes-file", "release-out/notes.md", "--latest"], check=True)
          PY
      - name: Nur die drei neuesten Releases behalten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GH_REPO}/releases" \
            --jq '.[] | select(.draft == false) | [.published_at, .tag_name] | @tsv' \
            | sort -r | tail -n +4 | cut -f2 > "$RUNNER_TEMP/old-releases.txt"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            gh release delete --yes -- "$tag"
          done < "$RUNNER_TEMP/old-releases.txt"
