name: AutarPie gemeinsam prüfen

on:
  push:
    branches: [main, 'test/2.0.*', 'publish/*', 'test/1.5.0*', 'test/1.6.0*', 'test/1.6.1*', 'test/1.6.6*', 'test/1.6.7*', 'test/1.6.8*', 'test/1.6.9*', 'test/1.6.10*', 'test/1.6.11*', 'test/1.6.12*', 'test/1.6.13*', 'test/1.7.0*', 'test/1.8.0*', 'test/1.8.1*', 'test/1.8.2*', 'test/1.8.3*', 'test/1.8.4*', 'test/1.9.0*', 'test/1.9.1*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autarpie-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Eigene Dashboards und bewusste Änderungen prüfen
        env:
          WATTPIT_CHROMIUM: /usr/bin/google-chrome
          WATTPIT_SCREENSHOT_DIR: app/build/reports/autarpie-ui
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/autarpie-ui" playwright@1.51.1
          NODE_PATH="$RUNNER_TEMP/autarpie-ui/node_modules" node tools/autarpie-smoke.cjs
          for attempt in 1 2; do
            NODE_PATH="$RUNNER_TEMP/autarpie-ui/node_modules" node tools/update-smoke.cjs
            NODE_PATH="$RUNNER_TEMP/autarpie-ui/node_modules" node tools/dashboard-appearance-smoke.cjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutarPie-Oberflaeche
          path: app/build/reports/autarpie-ui/

  period-storage-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kachelzeiträume mit alter und neuer Speicherung wiederholt prüfen
        env:
          WATTPIT_CHROMIUM: /usr/bin/google-chrome
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/autarpie-period-ui" playwright@1.51.1
          export NODE_PATH="$RUNNER_TEMP/autarpie-period-ui/node_modules"
          for attempt in 1 2 3 4 5; do
            node tools/tile-period-isolation-smoke.cjs
          done

  supplies-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Gas- und Wasserbedienung unabhängig vom Android-Build prüfen
        run: |
          python3 tools/check-public-files.py
          npm install --no-save --prefix "$RUNNER_TEMP/wohnpit-supplies-ui" playwright@1.51.1
          NODE_PATH="$RUNNER_TEMP/wohnpit-supplies-ui/node_modules" WATTPIT_CHROMIUM=/usr/bin/google-chrome node tools/supplies-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/wohnpit-supplies-ui/node_modules" WATTPIT_CHROMIUM=/usr/bin/google-chrome node tools/mobile-solar-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gas-Wasser-Oberflaeche
          path: docs/images/supplies-*.png

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Dashboard-Berechnungen und Konfiguration prüfen
        run: node --test tools/update-core.test.cjs tools/autarpie-core.test.cjs tools/value-colors.test.cjs tools/weather-history.test.cjs tools/supplies-core.test.cjs tools/dashboard-core.test.cjs tools/equipment-core.test.cjs tools/settings-backup.test.cjs tools/tile-detail.test.cjs tools/read-bridge.test.cjs tools/energy-window-cache.test.cjs tools/control-bridge.test.cjs tools/solar-core.test.cjs tools/presence-core.test.cjs tools/roller-core.test.cjs tools/special-use-core.test.cjs
      - name: Private Dateien vor Veröffentlichung ausschließen
        run: python3 tools/check-public-files.py
      - name: Veröffentlichung und Übernahme-Hilfsprogramm prüfen
        run: python3 tools/prepare-release.test.py
      - name: Tests, Lint und Android-Build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Archivbedarf, Neustart und atomare Speicherung prüfen
        run: |
          deps="$RUNNER_TEMP/wattpit-proof-deps"
          mkdir -p "$deps"
          python3 tools/fetch-proof-deps.py "$deps"
          python3 tools/prove-archive-delta.py --output app/build/reports/archive-delta-proof --sqlite-jar "$deps/sqlite-jdbc-3.46.1.0.jar" --slf4j-jar "$deps/slf4j-api-1.7.36.jar"
          python3 tools/prove-archive-storage.py --output app/build/reports/archive-storage-proof --android-jar "$deps/android-api35.jar" --sqlite-jar "$deps/sqlite-jdbc-3.46.1.0.jar" --slf4j-jar "$deps/slf4j-api-1.7.36.jar"
          mkdir -p "$RUNNER_TEMP/roller-proof"
          java com.sun.tools.javac.Main -cp "$deps/android-api35.jar" -d "$RUNNER_TEMP/roller-proof" app/src/main/java/de/wattpit/app/core/BmsPacket.java app/src/main/java/de/wattpit/app/core/RollerEnergy.java app/src/main/java/de/wattpit/app/core/ChargeEfficiency.java app/src/main/java/de/wattpit/app/RollerStore.java app/src/main/java/de/wattpit/app/SpecialUses.java app/src/main/java/de/wattpit/app/RollerLedger.java app/src/main/java/de/wattpit/app/LearningWindow.java tools/testing/android/database/Cursor.java tools/testing/android/database/sqlite/SQLiteDatabase.java tools/testing/android/database/sqlite/SQLiteOpenHelper.java tools/RollerStoreProof.java
          java -cp "$RUNNER_TEMP/roller-proof:$deps/android-api35.jar:$deps/sqlite-jdbc-3.46.1.0.jar:$deps/slf4j-api-1.7.36.jar" de.wattpit.app.RollerStoreProof "$RUNNER_TEMP/roller-preferences"
          python3 tools/prove-archive-foreground.py --dependencies "$deps" --output app/build/reports/archive-foreground-proof --mode fixed
          python3 tools/prove-lan.py --output app/build/reports/lan-proof --android-jar "$deps/android-api35.jar" --sqlite-jar "$deps/sqlite-jdbc-3.46.1.0.jar" --slf4j-jar "$deps/slf4j-api-1.7.36.jar"
      - name: Native Abdeckung in allen Kurven prüfen
        env:
          WATTPIT_CHROMIUM: /usr/bin/google-chrome
          WATTPIT_COVERAGE_FIXTURE: ${{ runner.temp }}/coverage-fixture.json
          WATTPIT_SCREENSHOT_DIR: app/build/reports/sync-coverage
          WATTPIT_WEATHER_FIXTURE: app/build/reports/archive-storage-proof/weather-contract-fixture.json
          WATTPIT_QR_FIXTURE: ${{ runner.temp }}/pairing-qr-fixture.json
          WATTPIT_VIEWER_FIXTURE: app/build/reports/lan-proof/statistics/statistics.json
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/wattpit-ui" playwright@1.51.1
          mkdir -p "$RUNNER_TEMP/wattpit-java"
          classes=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          javac -cp "$classes" -d "$RUNNER_TEMP/wattpit-java" tools/SyncCoverageFixture.java
          java -cp "$RUNNER_TEMP/wattpit-java:$classes" de.wattpit.app.core.SyncCoverageFixture > "$WATTPIT_COVERAGE_FIXTURE"
          qr_cp="$classes:$RUNNER_TEMP/wattpit-proof-deps/zxing-core.jar"
          javac -cp "$qr_cp" -d "$RUNNER_TEMP/wattpit-java" tools/PairingQrFixture.java
          java -cp "$RUNNER_TEMP/wattpit-java:$qr_cp" de.wattpit.app.core.PairingQrFixture > "$WATTPIT_QR_FIXTURE"
          export NODE_PATH="$RUNNER_TEMP/wattpit-ui/node_modules"
          python3 tools/run-ui-checks.py
          # Repeat the cold statistics fixture in fresh browser contexts.
          for attempt in 1 2; do
            node tools/viewer-statistics-smoke.cjs
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Watt-n-Pit-CI-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pruefberichte
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/sync-coverage/
            app/build/reports/archive-delta-proof/report.json
            app/build/reports/archive-delta-proof/*.requests.tsv
            app/build/reports/archive-storage-proof/report.json
            app/build/reports/archive-storage-proof/results.log
            app/build/reports/archive-storage-proof/weather-contract-fixture.json
            app/build/reports/archive-foreground-proof/
            app/build/reports/lan-proof/report.json
            app/build/reports/lan-proof/central-concurrency-results.log
            app/build/reports/lan-proof/results.log
            app/build/reports/lan-proof/presence-results.log
            app/build/reports/lan-proof/viewer-idle-results.log
            app/build/reports/lan-proof/viewer-report.json
            app/build/reports/lan-proof/viewer-results.log
            app/build/reports/lan-proof/mobile-viewer-results.log
            app/build/reports/lan-proof/solar-inputs.json
            app/build/reports/lan-proof/statistics-results.log
            app/build/reports/lan-proof/statistics/statistics.json
            docs/images/viewer-statistics-2.0.3-*.png
            docs/images/supplies-*2.0.2*.png

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android-Testpakete bauen
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86
          profile: Nexus 5
          disable-animations: true
          script: |
            adb shell dumpsys webviewupdate
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class de.wattpit.app.UnifiedSmokeTest de.wattpit.app.test/androidx.test.runner.AndroidJUnitRunner | tee unified-emulator.log
            python3 -c "from pathlib import Path; s=Path('unified-emulator.log').read_text(); assert 'OK (4 tests)' in s and 'FAILURES' not in s"
            mkdir -p docs/images
            adb pull /sdcard/Android/data/de.wattpit.app/files/autarpie-3.0.2-central.png docs/images/
            adb pull /sdcard/Android/data/de.wattpit.app/files/autarpie-3.0.2-direct.png docs/images/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutarPie-3.0.2-Emulator
          path: |
            unified-emulator.log
            docs/images/autarpie-3.0.2-*.png
